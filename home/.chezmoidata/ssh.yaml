# The machine's SSH key: used to authenticate to GitHub and to sign commits.
#
# id_ed25519 is the name `gh auth login` creates and uploads, so whichever
# runs first (`chezmoi apply` or `gh auth login`) the other reuses the same
# key. Referenced by ~/.ssh/config, git's user.signingkey and
# .chezmoiscripts/run_onchange_after_20-ssh-and-github.sh. The private key never
# enters this repo.
ssh:
  key: id_ed25519
  type: ed25519

  # The S2 home server's key, on machines that answered yes to "Connect this
  # machine to the S2 home server". It is shared, not per machine: the private
  # key lives in Proton Pass (item below) and the SSH script copies it to
  # ~/.ssh/<key>. Referenced by ~/.ssh/config.
  s2:
    key: s2
    host: 192.168.0.2
    user: santiago
    item: "pass://03. Homelab (S2)/S2"   # vault/item; the script appends the field
    field: Private key
