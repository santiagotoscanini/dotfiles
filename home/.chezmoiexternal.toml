# Third-party code chezmoi downloads into $HOME, so the repo holds no vendored
# copies. Each entry is re-downloaded after `refreshPeriod`; force it now with
# `chezmoi apply --refresh-externals` (`-R`).
#
# `exact = true` makes chezmoi delete files it didn't download, so these
# directories stay clean. Runtime data written inside them is listed in
# .chezmoiignore so it isn't deleted.

# ---- Zsh ----

[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "archive"
    url = "https://github.com/romkatv/powerlevel10k/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-vi-mode"]
    type = "archive"
    url = "https://github.com/jeffreytse/zsh-vi-mode/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# ---- tmux ----

# TPM itself. Install the plugins in tmux.conf once with prefix + I.
[".tmux/plugins/tpm"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tpm/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# ---- Work ----

# Supabase CLI pinned to the version the Flai monorepo's CI and Cloud image use
# (.github/workflows/db-generate.yml). Homebrew only ships the latest release,
# and v3 rejects the repo's supabase/config.toml. Bump the version, URL and
# checksum together, from the release's supabase_<version>_checksums.txt.
[".local/bin/supabase"]
    type = "archive-file"
    url = "https://github.com/supabase/cli/releases/download/v2.75.0/supabase_darwin_arm64.tar.gz"
    checksum.sha256 = "6618736487287a9f0835c44a7101694deb4ca1192852a070a93014437641cea3"
    path = "supabase"
    executable = true
