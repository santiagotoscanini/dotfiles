# Third-party code chezmoi downloads into $HOME, so the repo holds no vendored
# copies. Each entry is re-downloaded after `refreshPeriod`; force it now with
# `chezmoi apply --refresh-externals` (`-R`).
#
# `exact = true` makes chezmoi delete files it didn't download, so these
# directories stay clean. Runtime data written inside them is listed in
# .chezmoiignore so it isn't deleted.

# ---- Zsh ----

[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "archive"
    url = "https://github.com/romkatv/powerlevel10k/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

[".oh-my-zsh/custom/plugins/zsh-vi-mode"]
    type = "archive"
    url = "https://github.com/jeffreytse/zsh-vi-mode/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# ---- tmux ----

# TPM itself. Install the plugins in tmux.conf once with prefix + I.
[".tmux/plugins/tpm"]
    type = "archive"
    url = "https://github.com/tmux-plugins/tpm/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
